services:
  - type: web
    name: vessify
    runtime: node
    plan: free
    buildCommand: npm run build && npm run migrate:deploy
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vessify-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

databases:
  - name: vessify-db
    plan: free
